name: Build Marco TV
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: marcotv-tools-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.py', 'scripts/bootstrap_lite.py') }}
      - name: Prepare official toolchains (API 28 + API 14 Lite + test libraries)
        run: |
          python scripts/bootstrap.py
          python scripts/bootstrap_lite.py
      - name: Build and verify Standard, Restricted, and Lite APKs
        run: |
          python scripts/build.py
          python scripts/build.py --restricted
          python scripts/build_lite.py
      - name: Run all offline host, transport, feedback, Lite, and release checks
        run: python scripts/test_offline.py
      - name: Verify web installation route guide
        run: python installer/tests/test_web_guide.py
      - name: Compile-only guard for all device instrumentation suites
        run: |
          python scripts/test_device_regressions.py --compile-only
          python scripts/test_home_setup_device.py --compile-only
          python scripts/test_home_setup_device.py --feedback --compile-only
          python scripts/test_drawer_home.py --compile-only
          python scripts/test_ui_motion.py --compile-only
          python scripts/test_lite_device.py --compile-only
          python scripts/test_lite_stability.py --compile-only
      - name: Package source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoTV-CI-development-build
          path: dist/*
          retention-days: 7
