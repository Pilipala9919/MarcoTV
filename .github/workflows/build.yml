name: Build Marco TV
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare official toolchain
        run: python scripts/bootstrap.py
      - name: Build and verify APK
        run: python scripts/build.py
      - name: Motion checks
        run: python scripts/test_motion.py
      - name: Release tool regression checks
        run: python scripts/test_release_tools.py
      - name: Settings migration checks
        run: python scripts/test_settings.py
      - name: Update policy checks
        run: python scripts/test_updates.py
      - name: Local phone transport checks
        run: python scripts/test_phone_http.py
      - name: Public source checks
        run: python scripts/check_release.py
      - name: Prepare Android 4.0 Lite toolchain
        run: python scripts/bootstrap_lite.py
      - name: Compile isolated Lite against API 14 and verify APK
        run: python scripts/build_lite.py
      - name: Lite layout and isolation checks
        run: python scripts/test_lite.py
      - name: Package source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoTV-CI-development-build
          path: dist/*
          retention-days: 7
